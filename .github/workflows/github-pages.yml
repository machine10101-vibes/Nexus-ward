name: GitHub Pages

on:
  push:
    branches: [main, cursor/nexus-ward-polish-pass-ef54]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static playable site
        run: npm run build:pages
        env:
          GITHUB_PAGES: "1"
          GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_AUTH_ENABLED: "false"
      - name: Collect public files
        run: |
          set -eu
          if [ -d dist/client ]; then
            SITE=dist/client
          elif [ -d .output/public ]; then
            SITE=.output/public
          elif [ -d dist ]; then
            SITE=dist
          else
            echo "No static output found" >&2
            ls -la
            exit 1
          fi
          mkdir -p _site
          cp -a "$SITE"/. _site/
          # GitHub Pages 404s unknown paths; copy the shell so /Nexus-ward/* still loads the game.
          if [ -f _site/index.html ]; then
            cp _site/index.html _site/404.html
          elif [ -f _site/_shell.html ]; then
            cp _site/_shell.html _site/index.html
            cp _site/_shell.html _site/404.html
          fi
          touch _site/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  # Same hosting as hunterscape / underkeep: static files on gh-pages, then
  # official project Pages at https://<owner>.github.io/<repo>/
  publish-branch:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          force_orphan: true

  enable-pages:
    needs: publish-branch
    runs-on: ubuntu-latest
    steps:
      - name: Point GitHub Pages at gh-pages /
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          payload='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          if gh api "repos/$GH_REPO/pages" >/dev/null 2>&1; then
            echo "Pages exists — keep legacy source on gh-pages /"
            printf '%s' "$payload" | gh api --method PUT "repos/$GH_REPO/pages" --input -
            exit 0
          fi
          echo "Creating Pages site from gh-pages /"
          if printf '%s' "$payload" | gh api --method POST "repos/$GH_REPO/pages" --input -; then
            exit 0
          fi
          echo "Retrying without build_type (older Pages API)"
          printf '%s' '{"source":{"branch":"gh-pages","path":"/"}}' \
            | gh api --method POST "repos/$GH_REPO/pages" --input -
